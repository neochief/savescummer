# Licenses a crate linked into the host, CLI or Tauri UI may use (PLAN-BUILD.md APP
# PACKAGE). Packaging fails on anything else, so licensing is checked on
# every build rather than at release time. Adding one is a deliberate choice.
accepted = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    # ksni, the Linux tray (public-domain dedication).
    "Unlicense",
    "Zlib",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true

# The app's own crates (all `publish = false`) aren't third-party.
[private]
ignore = true
