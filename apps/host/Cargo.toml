[package]
name = "savescummer-host"
version.workspace = true
edition.workspace = true

[[bin]]
name = "savescummer-host"
path = "src/main.rs"

[[bin]]
name = "savescummer"
path = "src/client.rs"

[dependencies]
savescummer-core.workspace = true
savescummer-snapshots.workspace = true
savescummer-storage.workspace = true
savescummer-scanner.workspace = true
savescummer-monitor.workspace = true
savescummer-platform.workspace = true
savescummer-ipc.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
fs2.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
winresource = "0.1.31"
