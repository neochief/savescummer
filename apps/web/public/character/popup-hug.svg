            <circle id="anchor-panel-left" cx="379" cy="550" r="5" style="fill:rgb(255,140,0);"/>
            <path id="guide-panel-edge" d="M379,450L379,800" style="fill:none;stroke:rgb(255,140,0);stroke-width:2px;"/>
