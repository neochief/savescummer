<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="590" viewBox="120 230 1010 590" version="1.1" style="fill-rule:nonzero;clip-rule:nonzero;stroke-linecap:round;stroke-linejoin:round;">
    <title>Skeleton hugging a panel — articulated artwork</title>
    <desc>Transparent, hand-drawn vector artwork. Left and right refer to the viewer. Nested shoulder, elbow, wrist and finger groups carry their own zero-opacity pivot guides. The detached right hand can attach to the opposite edge of any panel. Eye layers follow the shared skeletonEyes contract.</desc>
