# Release (PLAN-BUILD.md CI, RELEASING): a `v*` tag checks all four
# platforms, then drafts a GitHub release with all four platform files.
# A human publishes it.
#
# Build commands are `cargo xtask` commands.
name: Release

on:
  push:
    tags: ['v*']

# Never cancelled, so a release is never half-built.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Runners are idle desktops: run the e2e tests that take window focus.
  SAVESCUMMER_DESKTOP_TESTS: 1

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/ui/package.json
          cache: true
          cache_dependency_path: apps/ui/pnpm-lock.yaml
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache tools
        uses: actions/cache@v6
        with:
          path: |
            .runtime/tools/cargo-about
            .runtime/tools/inno-setup
          key: tools-${{ runner.os }}-${{ hashFiles('xtask/src/pins.rs') }}
      - name: Set up cargo-about
        run: cargo xtask setup cargo-about
      - name: Set up Inno Setup
        run: cargo xtask setup inno
      - name: Test
        run: cargo xtask test
      - name: Package the installer
        run: cargo xtask dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/ui/package.json
          cache: true
          cache_dependency_path: apps/ui/pnpm-lock.yaml
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache cargo-about
        uses: actions/cache@v6
        with:
          path: .runtime/tools/cargo-about
          key: cargo-about-${{ runner.os }}-${{ hashFiles('xtask/src/pins.rs') }}
      - name: Install librsvg
        run: brew install librsvg
      - name: Set up cargo-about
        run: cargo xtask setup cargo-about
      - name: Test
        run: cargo xtask test
      - name: Package the disk image
        run: cargo xtask dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good file
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/ui/package.json
          cache: true
          cache_dependency_path: apps/ui/pnpm-lock.yaml
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache tools
        uses: actions/cache@v6
        with:
          path: |
            .runtime/tools/cargo-about
            .runtime/tools/tauri-cache
            .runtime/tools/appimage
          key: tools-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('xtask/src/pins.rs') }}
      - name: Set up cargo-about
        run: cargo xtask setup cargo-about
      - name: Set up the AppImage tools
        run: cargo xtask setup linux-tools
      - name: Test
        run: cargo xtask test
      - name: Package the AppImage
        run: cargo xtask dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Upload to the draft release
        run: cargo xtask publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
