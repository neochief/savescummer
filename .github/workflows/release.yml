# Release (PLAN-BUILD.md CI, RELEASING): a `v*` tag builds the Windows
# installer and macOS disk image into a draft GitHub release. A human publishes it.
#
# Build commands are `cargo xtask` commands.
name: Release

on:
  push:
    tags: ['v*']

# Never cancelled, so a release is never half-built.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Runners are idle desktops: run the e2e tests that take window focus.
  SAVESCUMMER_DESKTOP_TESTS: 1

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/ui/package.json
          cache: true
          cache_dependency_path: apps/ui/pnpm-lock.yaml
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache tools
        uses: actions/cache@v6
        with:
          path: |
            .runtime/tools/cargo-about
            .runtime/tools/inno-setup
          key: tools-${{ runner.os }}-${{ hashFiles('xtask/src/pins.rs') }}
      - name: Set up cargo-about
        run: cargo xtask setup cargo-about
      - name: Set up Inno Setup
        run: cargo xtask setup inno
      - name: Build the installer
        run: cargo xtask dist
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS disk image
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/ui/package.json
          cache: true
          cache_dependency_path: apps/ui/pnpm-lock.yaml
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache cargo-about
        uses: actions/cache@v6
        with:
          path: .runtime/tools/cargo-about
          key: cargo-about-${{ runner.os }}-${{ hashFiles('xtask/src/pins.rs') }}
      - name: Install librsvg
        run: brew install librsvg
      - name: Set up cargo-about
        run: cargo xtask setup cargo-about
      - name: Build the disk image
        run: cargo xtask dist
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Upload to the draft release
        run: cargo xtask publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
