# CI (PLAN-BUILD.md CI): nothing merges that breaks a platform.
#
# Build commands are `cargo xtask` commands, so failures reproduce locally.
# Windows and macOS both ship the Tauri UI.
name: CI

on:
  push:
    # Branch pushes only; tags are built by release.yml.
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Runners are idle desktops: run the e2e tests that take window focus.
  SAVESCUMMER_DESKTOP_TESTS: 1

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # rustup applies rust-toolchain.toml on first use.
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/ui/package.json
          cache: true
          cache_dependency_path: apps/ui/pnpm-lock.yaml
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache tools
        uses: actions/cache@v6
        with:
          path: |
            .runtime/tools/cargo-about
            .runtime/tools/inno-setup
          key: tools-${{ runner.os }}-${{ hashFiles('xtask/src/pins.rs') }}
      - name: Set up cargo-about
        run: cargo xtask setup cargo-about
      - name: Set up Inno Setup
        run: cargo xtask setup inno
      - name: Check
        run: cargo xtask check
      - name: Build and test the installer
        run: cargo xtask dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS
    # Apple Silicon, the only Macs SaveScummer supports.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/ui/package.json
          cache: true
          cache_dependency_path: apps/ui/pnpm-lock.yaml
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache cargo-about
        uses: actions/cache@v6
        with:
          path: .runtime/tools/cargo-about
          key: cargo-about-${{ runner.os }}-${{ hashFiles('xtask/src/pins.rs') }}
      # The app icon is rendered from assets/icon.svg.
      - name: Install librsvg
        run: brew install librsvg
      - name: Set up cargo-about
        run: cargo xtask setup cargo-about
      - name: Check
        run: cargo xtask check
      - name: Build and test the disk image
        run: cargo xtask dist
      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
