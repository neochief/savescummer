# CI (PLAN-BUILD.md CI): the full check and package on every platform, for
# the `release` branch: main is merged into it to release, and its tag is
# pushed only once this passes (release.yml builds the tag). Other branches
# can run it by hand from the Actions tab.
#
# Build commands are `cargo xtask` commands, so failures reproduce locally.
# Windows and macOS both ship the Tauri UI; Linux builds its AppImages for
# x86_64 and aarch64 but doesn't ship them yet.
name: CI

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Runners are idle desktops: run the e2e tests that take window focus.
  SAVESCUMMER_DESKTOP_TESTS: 1

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # rustup applies rust-toolchain.toml on first use.
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/ui/package.json
          cache: true
          cache_dependency_path: apps/ui/pnpm-lock.yaml
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache tools
        uses: actions/cache@v6
        with:
          path: |
            .runtime/tools/cargo-about
            .runtime/tools/inno-setup
          key: tools-${{ runner.os }}-${{ hashFiles('xtask/src/pins.rs') }}
      - name: Set up cargo-about
        run: cargo xtask setup cargo-about
      - name: Set up Inno Setup
        run: cargo xtask setup inno
      - name: Check
        run: cargo xtask check
      - name: Build and test the installer
        run: cargo xtask dist
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS
    # Apple Silicon, the only Macs SaveScummer supports.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/ui/package.json
          cache: true
          cache_dependency_path: apps/ui/pnpm-lock.yaml
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache cargo-about
        uses: actions/cache@v6
        with:
          path: .runtime/tools/cargo-about
          key: cargo-about-${{ runner.os }}-${{ hashFiles('xtask/src/pins.rs') }}
      # The app icon is rendered from assets/icon.svg.
      - name: Install librsvg
        run: brew install librsvg
      - name: Set up cargo-about
        run: cargo xtask setup cargo-about
      - name: Check
        run: cargo xtask check
      - name: Build and test the disk image
        run: cargo xtask dist
      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    # The oldest supported Ubuntu, so the AppImage runs on its glibc and newer.
    runs-on: ${{ matrix.runner }}
    # Until Linux ships (xtask/src/naming.rs), a Linux failure shows here
    # without failing the run, so it never holds up a Windows or macOS release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        # Tauri's WebKitGTK and GTK, which its AppImage bundles, and `file`,
        # which checks every program's architecture.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf gstreamer1.0-plugins-base gstreamer1.0-plugins-good file
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/ui/package.json
          cache: true
          cache_dependency_path: apps/ui/pnpm-lock.yaml
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Cache tools
        uses: actions/cache@v6
        with:
          path: |
            .runtime/tools/cargo-about
            .runtime/tools/tauri-cache
            .runtime/tools/appimage
          key: tools-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('xtask/src/pins.rs') }}
      - name: Set up cargo-about
        run: cargo xtask setup cargo-about
      - name: Set up the AppImage tools
        run: cargo xtask setup linux-tools
      - name: Check
        run: cargo xtask check
      - name: Build and test the AppImage
        run: cargo xtask dist
      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}-appimage
          path: dist/*.AppImage
          if-no-files-found: error
