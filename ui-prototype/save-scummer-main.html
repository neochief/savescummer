<div id="scummer-sketch" aria-label="SaveScummer main window" data-accent="violet">
  <style>
    #scummer-sketch{--ss-bg:light-dark(#f5f5f5,#191919);--ss-chrome:light-dark(#fafafa,#1f1f1f);--ss-surface:light-dark(#fff,#242424);--ss-text:light-dark(#242424,#eee);--ss-muted:light-dark(#686868,#aaa);--ss-line:light-dark(#dcdcdc,#3b3b3b);--ss-soft:light-dark(#ededed,#303030);--ss-brand:#9747ff;--ss-accent:light-dark(#9747ff,#bc8dff);--ss-tint:light-dark(#ededed,#333);--ss-on:light-dark(#fff,#191919);--ss-green:light-dark(#277749,#8bd4ac);--ss-shadow:light-dark(#00000022,#00000060);--ss-row:32px;position:relative;color:var(--ss-text);font-family:"Segoe UI Variable","Segoe UI",sans-serif;font-size:13px;line-height:1.35;width:100%;max-width:620px;margin:0 auto;isolation:isolate}
    #scummer-sketch *{box-sizing:border-box}
    #scummer-sketch [hidden]{display:none!important}
    #scummer-sketch button,#scummer-sketch input{font:inherit}
    #scummer-sketch button{color:inherit}
    #scummer-sketch .ss-window{background:var(--ss-bg);border:1px solid var(--ss-line);border-radius:8px;overflow:hidden}
    #scummer-sketch .ss-titlebar{display:flex;align-items:center;justify-content:space-between;min-height:36px;background:var(--ss-chrome);border-bottom:1px solid var(--ss-line);padding:0 10px 0 18px}
    #scummer-sketch .ss-brand{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}
    #scummer-sketch #ss-app-icon{display:block;width:27px;height:27px;border-radius:5px;flex-shrink:0}
    #scummer-sketch .ss-window-controls{display:flex;align-items:center;gap:23px;color:var(--ss-muted);font-size:14px}
    #scummer-sketch .ss-check{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ss-muted);white-space:nowrap}
    #scummer-sketch .ss-check input{width:13px;height:13px;margin:0;accent-color:var(--ss-brand)}
    #scummer-sketch .ss-list{padding:0;position:relative}
    #scummer-sketch .ss-game{position:relative;width:100%;padding:12px 18px;background:transparent;border:0;border-radius:0;box-shadow:none;margin:0}
    #scummer-sketch .ss-game:hover{background:light-dark(#ededed,#141414)}
    #scummer-sketch .ss-game[data-selected="true"]{background:light-dark(#e7e7e7,#101010)}
    #scummer-sketch .ss-select{position:absolute;inset:0;z-index:0;width:100%;height:100%;padding:0;border:0;border-radius:0;background:transparent}
    #scummer-sketch .ss-game-head{position:relative;z-index:1;display:flex;align-items:center;gap:8px;margin-bottom:0;pointer-events:none}
    #scummer-sketch .ss-game[data-selected="true"] .ss-game-head{margin-bottom:7px}
    #scummer-sketch .ss-game-icon{width:27px;height:27px;border-radius:5px;display:grid;place-items:center;flex-shrink:0;font-size:10px;font-weight:500;letter-spacing:.2px;background:var(--ss-soft);border:1px solid var(--ss-line);color:var(--ss-muted)}
    #scummer-sketch .ss-game h2{font-size:14px;line-height:1.3;margin:0;font-weight:500}
    #scummer-sketch .ss-game-status{margin-left:2px;color:var(--ss-muted);font-size:11px;white-space:nowrap}
    #scummer-sketch .ss-game-status[data-status="running"]{color:var(--ss-green)}
    #scummer-sketch .ss-controls{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,158px)) 28px;gap:6px;align-items:stretch}
    #scummer-sketch .ss-info{position:relative;z-index:1;margin-top:10px;padding:0;border:0;background:transparent;font-size:12px;line-height:1.45;overflow-wrap:anywhere;user-select:text}
    #scummer-sketch .ss-info p{margin:0;font-weight:500}
    #scummer-sketch .ss-info ol{margin:4px 0 10px;padding-left:18px}
    #scummer-sketch .ss-info li+li{margin-top:3px}
    #scummer-sketch .ss-info>:last-child{margin-bottom:0}
    #scummer-sketch .ss-info-empty{color:var(--ss-muted)}
    #scummer-sketch .ss-more{margin-left:auto;display:grid;place-items:center;width:28px;height:32px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--ss-muted)}
    #scummer-sketch .ss-controls>.ss-more{grid-column:3;align-self:center}
    #scummer-sketch .ss-more[aria-expanded="true"]{background:var(--ss-tint);color:light-dark(#7b2ed7,#cba5ff);border-color:var(--ss-line)}
    #scummer-sketch .ss-button{display:flex;align-items:center;justify-content:center;gap:5px;min-height:36px;padding:3px 8px;background:var(--ss-surface);border:1px solid var(--ss-line);border-radius:4px;font-size:12px;white-space:nowrap}
    #scummer-sketch .ss-button:hover,#scummer-sketch .ss-more:hover{background:var(--ss-soft)}
    #scummer-sketch .ss-load{display:grid;grid-template-columns:minmax(0,1fr) 27px}
    #scummer-sketch .ss-load-main{min-width:0;border-radius:4px 0 0 4px;flex-direction:column;gap:0;padding:2px 6px}
    #scummer-sketch .ss-age{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ss-muted);font-size:11px;line-height:1.2}
    #scummer-sketch .ss-chevron{border-radius:0 4px 4px 0;border-left:0;padding:0}
    #scummer-sketch .ss-chevron[aria-expanded="true"]{background:var(--ss-tint);color:light-dark(#7b2ed7,#cba5ff);border-color:color-mix(in srgb,var(--ss-brand) 45%,var(--ss-line))}
    #scummer-sketch button:disabled{opacity:.42;cursor:default}
    #scummer-sketch .ss-progress{position:absolute;grid-column:1 / 3;left:0;right:0;bottom:-1px;height:2px;background:var(--ss-line);overflow:hidden;border-radius:0 0 4px 4px}
    #scummer-sketch .ss-progress>span{display:block;height:100%;background:var(--ss-brand);width:0;transition:width .2s linear}
    #scummer-sketch .ss-history,#scummer-sketch .ss-menu{position:absolute;z-index:20;background:var(--ss-surface);border:1px solid var(--ss-line);border-radius:6px;box-shadow:0 8px 22px var(--ss-shadow),0 1px 3px var(--ss-shadow);overflow:hidden}
    #scummer-sketch .ss-history{width:354px}
    #scummer-sketch .ss-history-list{max-height:326px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--ss-line) var(--ss-surface);padding:3px 4px 5px}
    #scummer-sketch .ss-day{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 6px 4px;font-size:11px;font-weight:500;color:var(--ss-text)}
    #scummer-sketch .ss-day span:last-child{color:var(--ss-muted);font-weight:400}
    #scummer-sketch .ss-day:not(:first-child){border-top:1px solid var(--ss-line);margin-top:4px}
    #scummer-sketch .ss-history-row{display:grid;grid-template-columns:52px 16px minmax(0,1fr) 63px;gap:6px;align-items:center;min-height:var(--ss-row);padding:3px 6px;border-radius:4px;font-size:12px}
    #scummer-sketch .ss-time{font-size:11px;font-variant-numeric:tabular-nums;color:var(--ss-muted)}
    #scummer-sketch .ss-event-icon{display:flex;align-items:center;color:var(--ss-muted)}
    #scummer-sketch .ss-row-label{min-width:0}
    #scummer-sketch .ss-reference{color:var(--ss-muted);font-size:11px}
    #scummer-sketch .ss-marker{min-height:23px;font-size:11px;color:var(--ss-muted)}
    #scummer-sketch .ss-marker .ss-event-icon{justify-content:center}
    #scummer-sketch .ss-marker .ss-event-icon::after{content:"";width:4px;height:4px;border:1px solid var(--ss-muted);border-radius:50%}
    #scummer-sketch .ss-row-action{border:1px solid var(--ss-line);border-radius:3px;background:var(--ss-surface);padding:3px 6px;font-size:11px;min-height:24px;text-align:center}
    #scummer-sketch .ss-history-row:not(.ss-marker):hover{background:var(--ss-soft)}
    #scummer-sketch .ss-history-row.ss-preview{background:var(--ss-tint)}
    #scummer-sketch .ss-history-row.ss-preview .ss-row-action,#scummer-sketch .ss-row-action:hover{background:var(--ss-accent);color:var(--ss-on);border-color:var(--ss-accent)}
    #scummer-sketch .ss-history-row.ss-preview .ss-event-icon{color:light-dark(#7b2ed7,#cba5ff)}
    #scummer-sketch .ss-unavailable{font-size:11px;color:var(--ss-muted);display:block}
    #scummer-sketch .ss-menu{width:158px;padding:4px}
    #scummer-sketch .ss-menu button{display:block;width:100%;text-align:left;padding:6px 8px;min-height:28px;background:transparent;border:0;border-radius:3px;font-size:12px}
    #scummer-sketch .ss-menu button:hover{background:var(--ss-soft)}
    #scummer-sketch .ss-other-group{width:100%}
    #scummer-sketch[data-running="true"] .ss-other-group::before{content:"";display:block;margin:0;border-top:1px dotted var(--ss-line)}
    #scummer-sketch .ss-other-toggle{display:flex;align-items:center;gap:7px;width:100%;min-height:27px;padding:8px 18px;border:0;background:transparent;text-align:left;font-size:12px;color:var(--ss-muted)}
    #scummer-sketch .ss-other-toggle:hover{color:var(--ss-text);background:light-dark(#ededed,#141414)}
    #scummer-sketch .ss-other-toggle svg{transition:transform .12s ease}
    #scummer-sketch .ss-other-toggle[aria-expanded="true"] svg{transform:rotate(90deg)}
    #scummer-sketch .ss-other-count{font-size:11px;border-radius:3px;background:var(--ss-soft);padding:0 5px;color:var(--ss-muted)}
    #scummer-sketch #ss-other-games{padding:0}
    #scummer-sketch .ss-footer{display:flex;align-items:center;justify-content:flex-start;flex-wrap:wrap;gap:6px 12px;padding:7px 10px;background:var(--ss-chrome);border-top:1px solid var(--ss-line);font-size:11px;color:var(--ss-muted)}
    #scummer-sketch .ss-footer-shortcuts{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
    #scummer-sketch .ss-startup{margin-left:auto}
    #scummer-sketch .ss-footer span{display:flex;align-items:center;gap:5px}
    #scummer-sketch kbd{font:inherit;color:var(--ss-muted);background:var(--ss-soft);border:1px solid var(--ss-line);border-radius:3px;padding:1px 4px}
    #scummer-sketch .ss-notice{padding:6px 10px;background:var(--ss-tint);color:light-dark(#7b2ed7,#cba5ff);font-size:11px;border-bottom:1px solid var(--ss-line)}
    #scummer-sketch .ss-only-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    @media(max-width:480px){#scummer-sketch .ss-titlebar{padding-left:14px}#scummer-sketch .ss-game{padding:10px 14px}#scummer-sketch .ss-other-toggle{padding-left:14px;padding-right:14px}#scummer-sketch .ss-controls{gap:5px}#scummer-sketch .ss-window-controls{gap:18px}}
    @media(max-width:360px){#scummer-sketch .ss-history-row{grid-template-columns:51px minmax(0,1fr) 59px;gap:5px}#scummer-sketch .ss-event-icon{display:none}}
    @media(pointer:coarse){#scummer-sketch .ss-button,#scummer-sketch .ss-row-action,#scummer-sketch .ss-more,#scummer-sketch .ss-other-toggle,#scummer-sketch .ss-menu button{min-height:44px}#scummer-sketch .ss-history-row{min-height:50px}#scummer-sketch .ss-marker{min-height:28px}#scummer-sketch .ss-check{min-height:32px}}
    @media(prefers-reduced-motion:reduce){#scummer-sketch .ss-progress>span,#scummer-sketch .ss-other-toggle svg{transition:none}#scummer-sketch .ss-history,#scummer-sketch .ss-menu{animation:none}}
  </style>

    </footer>
  </div>
  <div class="ss-only-reader" id="ss-live" aria-live="polite"></div>
  <script>
  (()=>{
    const root=document.getElementById('scummer-sketch');
    const q=s=>root.querySelector(s);
    const library={
      'void-war':{info:`To save the current game progress:
1. Exit to Main Menu (the game saves data here).
2. Run "Save" in SaveScummer.
3. In-game, choose Continue from Main Menu.

To load the saved game progress:
1. Exit to Main Menu (loading from here won't work because the game data is still in memory).
2. Go to Tutorial (this clears the last run from memory).
3. Run "Load" in SaveScummer.
4. In-game, go to Main Menu, then Continue. You should see the loaded state.`},
      'ftl':{info:''},
      'slay-the-spire':{info:''},
      'into-the-breach':{info:''}
    };
    let selectedGameId='void-war';
    root.querySelectorAll('.ss-game').forEach(game=>{
      const id=game.dataset.gameId,name=game.querySelector('h2').textContent;
      const selectButton=document.createElement('button');
      selectButton.type='button';selectButton.className='ss-select cursor-interaction';selectButton.dataset.selectGame=id;
      selectButton.setAttribute('aria-label','Select '+name);selectButton.setAttribute('aria-pressed','false');selectButton.setAttribute('aria-expanded','false');selectButton.setAttribute('aria-controls','ss-controls-'+id+' ss-info-'+id);
      game.prepend(selectButton);game.querySelector('.ss-controls').id='ss-controls-'+id;
      const panel=document.createElement('section');panel.className='ss-info';panel.id='ss-info-'+id;panel.hidden=true;panel.setAttribute('aria-label',name+' instructions');
      const info=library[id].info;
      if(info.trim()){
        let list=null;
        info.split('\n').forEach(line=>{
          if(!line.trim()){list=null;return;}
          const step=line.match(/^\d+\.\s+(.+)$/);
          if(step){
            if(!list){list=document.createElement('ol');panel.append(list);}
            const item=document.createElement('li');item.textContent=step[1];list.append(item);
          }else{list=null;const paragraph=document.createElement('p');paragraph.textContent=line;panel.append(paragraph);}
        });
      }else{panel.textContent='No instructions available for this game yet.';panel.classList.add('ss-info-empty');}
      game.querySelector('.ss-controls').after(panel);
      const button=game.querySelector('.ss-more');
      game.querySelector('.ss-controls').append(button);
      button.dataset.menuTrigger=game.querySelector('h2').textContent;
      button.removeAttribute('data-demo');
      button.setAttribute('aria-controls','ss-more-menu');
      button.setAttribute('aria-haspopup','true');
    });
    root.append(q('#ss-history'),q('.ss-menu'));
    q('.ss-menu').id='ss-more-menu';
    q('#ss-history-toggle').setAttribute('aria-haspopup','true');
    const design={appearance:'System',accent:'violet',density:'Compact',running:true};
    const initial=[
      {id:'s1950',time:'19:50',kind:'Saved'},
      {id:'start1944',time:'19:44',kind:'Game started',marker:true},
      {id:'r1943',time:'19:43',kind:'Reverted',target:'19:42'},
      {id:'l1942',time:'19:42',kind:'Loaded',target:'19:25'},
      {id:'close1941',time:'19:41',kind:'Game closed',marker:true},
      {id:'s1938',time:'19:38',kind:'Saved'},
      {id:'s1925',time:'19:25',kind:'Saved'},
      {id:'start1920',time:'19:20',kind:'Game started',marker:true}
    ];
    const previous=[{id:'existing',time:'—',kind:'Existing backup',detail:'Save time unknown'}, {id:'missing',time:'21:10',kind:'Saved',detail:'Backup unavailable',unavailable:true}];
    let events=initial.map(e=>({...e})),busy=false,open=false,menuOpen=false,menuAnchor=q('[data-more]'),othersOpen=false,lastRunning=true,latest='2 minutes ago',counter=0;
    const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function row(e){
      const action=e.kind==='Saved'||e.kind==='Existing backup'?'Restore':'Revert';
      const icon=e.kind==='Saved'?'save':e.kind==='Loaded'?'corner-down-left':e.kind==='Existing backup'?'folder':'rotate-ccw';
      return `<div class="ss-history-row ${e.marker?'ss-marker':''} ${e.id==='s1925'?'ss-preview':''}" data-row="${escape(e.id)}"><time class="ss-time">${escape(e.time)}</time><span class="ss-event-icon">${e.marker?'':`<i data-lucide="${icon}" aria-hidden="true"></i>`}</span><span class="ss-row-label">${escape(e.kind)}${e.target?` <span class="ss-reference">[${escape(e.target)}]</span>`:''}${e.detail?`<span class="ss-unavailable">${escape(e.detail)}</span>`:''}</span>${e.marker?'':`<button type="button" class="ss-row-action cursor-interaction" data-history-action="${action}" data-id="${escape(e.id)}" aria-label="${action} ${escape(e.kind)} ${escape(e.time)}" ${busy||e.unavailable?'disabled':''}>${action}</button>`}</div>`;
    }
    function renderRows(){
      q('#ss-history-rows').innerHTML='<div class="ss-day"><span>Today</span><span>20 September</span></div>'+events.map(row).join('')+'<div class="ss-day"><span>Yesterday</span><span>19 September</span></div>'+row(previous[1])+'<div class="ss-day"><span>Other backups</span></div>'+row(previous[0]);
      if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
    }
    function positionDropdowns(){
      const bounds=root.getBoundingClientRect(),windowBottom=q('.ss-window').getBoundingClientRect().bottom-bounds.top;
      let bottom=windowBottom;
      if(open){
        const trigger=q('#ss-history-toggle').getBoundingClientRect(),load=q('.ss-load').getBoundingClientRect(),panel=q('#ss-history'),width=Math.min(354,root.clientWidth-12);
        const left=Math.max(6,Math.min(load.left-bounds.left,root.clientWidth-width-6)),top=trigger.bottom-bounds.top+4;
        panel.style.width=width+'px';panel.style.left=left+'px';panel.style.top=top+'px';
        bottom=Math.max(bottom,top+panel.offsetHeight+8);
      }
      if(menuOpen){
        const trigger=menuAnchor.getBoundingClientRect(),panel=q('.ss-menu'),width=Math.min(158,root.clientWidth-12),top=trigger.bottom-bounds.top+4;
        panel.style.width=width+'px';panel.style.left=Math.max(6,Math.min(trigger.right-bounds.left-width,root.clientWidth-width-6))+'px';panel.style.top=top+'px';
        bottom=Math.max(bottom,top+panel.offsetHeight+8);
      }
      root.style.paddingBottom=Math.max(0,bottom-windowBottom)+'px';
    }
    function render(){
      if(design.running!==lastRunning){if(design.running)othersOpen=selectedGameId!=='void-war';lastRunning=design.running;}
      root.dataset.running=String(design.running);
      q('#ss-void-game').setAttribute('aria-label',design.running?'Void War, running':'Void War');
      q('[data-status="running"]').hidden=!design.running;
      q('#ss-other-toggle').hidden=!design.running;
      q('#ss-other-toggle').setAttribute('aria-expanded',String(!design.running||othersOpen));
      q('#ss-other-games').hidden=design.running&&!othersOpen;
      root.querySelectorAll('.ss-game').forEach(game=>{
        const selected=game.dataset.gameId===selectedGameId;
        game.dataset.selected=String(selected);game.querySelector('.ss-controls').hidden=!selected;game.querySelector('.ss-info').hidden=!selected;
        game.querySelector('.ss-select').setAttribute('aria-pressed',String(selected));game.querySelector('.ss-select').setAttribute('aria-expanded',String(selected));
      });
      if(selectedGameId!=='void-war')open=false;
      if(menuAnchor.closest('[hidden]'))menuOpen=false;
      root.style.colorScheme=design.appearance==='System'?'':design.appearance.toLowerCase();
      root.dataset.accent=design.accent;
      root.style.setProperty('--ss-row',design.density==='Compact'?'32px':'38px');
      q('#ss-history').hidden=!open;
      q('.ss-menu').hidden=!menuOpen;
      root.querySelectorAll('[data-menu-trigger]').forEach(button=>button.setAttribute('aria-expanded',String(menuOpen&&button===menuAnchor)));
      q('.ss-menu').setAttribute('aria-label',menuAnchor.dataset.menuTrigger+' options');
      q('#ss-history-toggle').setAttribute('aria-expanded',String(open));
      q('#ss-latest-age').textContent=latest;
      root.querySelectorAll('.ss-age').forEach(age=>age.setAttribute('data-tooltip',age.textContent));
      for(const id of ['#ss-save','#ss-load','#ss-history-toggle'])q(id).disabled=busy;
      q('.ss-progress').hidden=!busy;
      root.querySelectorAll('[data-history-action]').forEach(b=>b.disabled=busy||b.dataset.id==='missing');
      const menuBusy=busy&&menuAnchor.dataset.menuTrigger==='Void War',emptyHistory=menuAnchor.closest('.ss-game').id==='ss-never-run-game';
      root.querySelectorAll('[data-menu-action]').forEach(b=>b.disabled=b.dataset.menuAction!=='Explore'&&(menuBusy||(b.dataset.menuAction==='Flush history'&&emptyHistory)));
      positionDropdowns();
    }
    function persist(){
      if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{screen:'SaveScummer',selectedGameId,design:{...design}},privateContent:{open,menuOpen,menuGame:menuAnchor.dataset.menuTrigger,selectedGameId,othersOpen,latest,events:events.slice(0,30),start:q('#ss-start').checked,sounds:q('#ss-sounds').checked}}).catch(()=>{});
    }
    function applyState(saved){
      if(!saved)return;
      const d=saved.modelContent?.design,p=saved.privateContent;
      if(d){if(['System','Light','Dark'].includes(d.appearance))design.appearance=d.appearance;if(['Compact','Comfortable'].includes(d.density))design.density=d.density;if(typeof d.running==='boolean')design.running=d.running;}
      if(typeof p?.othersOpen==='boolean')othersOpen=p.othersOpen;
      if(typeof p?.selectedGameId==='string'&&Object.hasOwn(library,p.selectedGameId))selectedGameId=p.selectedGameId;
      if(selectedGameId!=='void-war')othersOpen=true;
      if(p){if(typeof p.open==='boolean')open=p.open;if(typeof p.latest==='string')latest=p.latest;if(Array.isArray(p.events)&&p.events.every(e=>typeof e.id==='string'&&typeof e.kind==='string'&&typeof e.time==='string'))events=p.events.slice(0,30);if(typeof p.start==='boolean')q('#ss-start').checked=p.start;if(typeof p.sounds==='boolean')q('#ss-sounds').checked=p.sounds;}
      if(typeof p?.menuOpen==='boolean')menuOpen=p.menuOpen&&!open;
      if(typeof p?.menuGame==='string')menuAnchor=Array.from(root.querySelectorAll('[data-menu-trigger]')).find(button=>button.dataset.menuTrigger===p.menuGame)||q('[data-more]');
      renderRows();render();
    }
    function selectGame(id){
      if(!Object.hasOwn(library,id)||id===selectedGameId)return;
      selectedGameId=id;if(id!=='void-war')othersOpen=true;open=false;menuOpen=false;render();persist();
    }
    let noticeTimer;
    function notice(text){q('.ss-notice').textContent=text;q('.ss-notice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{q('.ss-notice').hidden=true;},4200);}
    function operate(action,entry){
      if(busy)return;
      busy=true;render();let value=0;
      const bar=q('.ss-progress'),fill=q('.ss-progress>span');fill.style.width='0%';bar.setAttribute('aria-valuenow','0');bar.setAttribute('aria-label',`${action} Void War — preview`);
      const timer=setInterval(()=>{
        value+=20;fill.style.width=value+'%';bar.setAttribute('aria-valuenow',String(value));
        if(value>=100){clearInterval(timer);counter++;const minute=52+Math.floor(counter/60),second=counter%60;const time=`19:${String(minute).padStart(2,'0')}:${String(second).padStart(2,'0')}`;
          events.unshift({id:'demo-'+Date.now()+'-'+counter,time,kind:action==='Save'?'Saved':action==='Restore'?'Loaded':'Reverted',...(entry?{target:entry.time}:{})});
          if(action==='Save')latest='just now';
          busy=false;renderRows();render();q('#ss-live').textContent=`Preview: ${action} completed. No game files changed.`;persist();
        }
      },180);
    }
    q('#ss-history-toggle').addEventListener('click',()=>{open=!open;menuOpen=false;render();persist();});
    q('#ss-other-toggle').addEventListener('click',()=>{othersOpen=!othersOpen;menuOpen=false;if(othersOpen)open=false;else if(selectedGameId!=='void-war')selectedGameId='void-war';render();persist();});
    q('#ss-save').addEventListener('click',()=>operate('Save'));
    q('#ss-load').addEventListener('click',()=>operate('Restore',events.find(e=>e.kind==='Saved')));
    q('#ss-history-rows').addEventListener('click',e=>{const b=e.target.closest('[data-history-action]');if(!b)return;const entry=[...events,...previous].find(r=>r.id===b.dataset.id);if(entry&&!entry.unavailable)operate(b.dataset.historyAction,entry);});
    q('#ss-history-rows').addEventListener('pointerover',e=>{const r=e.target.closest('.ss-history-row');if(!r||r.classList.contains('ss-marker'))return;root.querySelectorAll('.ss-preview').forEach(x=>x.classList.remove('ss-preview'));r.classList.add('ss-preview');});
    root.querySelectorAll('[data-menu-trigger]').forEach(button=>button.addEventListener('click',()=>{menuOpen=button!==menuAnchor||!menuOpen;menuAnchor=button;open=false;render();persist();}));
    root.addEventListener('click',e=>{
      const game=e.target.closest('.ss-game');
      if(game){selectGame(game.dataset.gameId);if(!e.target.closest('.ss-controls')&&(open||menuOpen)){open=false;menuOpen=false;render();persist();}}
      else if(e.target.closest('#ss-history'))selectGame('void-war');
      else if(e.target.closest('.ss-menu'))selectGame(menuAnchor.closest('.ss-game').dataset.gameId);
    },true);
    root.addEventListener('click',e=>{const demo=e.target.closest('[data-demo]'),menu=e.target.closest('[data-menu-action]');if(demo)notice('This sketch demonstrates the Void War history.');if(menu){const game=menuAnchor.dataset.menuTrigger;menuOpen=false;render();notice(menu.dataset.menuAction==='Explore'?`Preview: Explore opens the folder containing ${game}’s game data and backups.`:menu.dataset.menuAction==='Configure'?`Preview: Configure opens executable and game-data path settings for ${game}.`:`Preview: Flush history asks for confirmation before deleting ${game} backups and recovery points.`);persist();}});
    root.addEventListener('keydown',e=>{if(e.key==='Escape'&&(open||menuOpen)){const trigger=menuOpen?menuAnchor:q('#ss-history-toggle');open=false;menuOpen=false;render();if(!trigger.disabled)trigger.focus();persist();}});
    document.addEventListener('pointerdown',e=>{if(!(open||menuOpen))return;if(root.contains(e.target)&&e.target.closest('#ss-history,.ss-menu,.ss-game'))return;open=false;menuOpen=false;render();persist();});
    q('#ss-start').addEventListener('change',persist);q('#ss-sounds').addEventListener('change',persist);
    renderRows();render();applyState(window.openai?.widgetState);
    new ResizeObserver(positionDropdowns).observe(q('.ss-window'));
    window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState&&!busy)applyState(e.detail.globals.widgetState);});
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();persist();}});tweak.addSelect(design,'appearance',{label:'Appearance',options:['System','Light','Dark']});tweak.addSelect(design,'density',{label:'History spacing',options:['Compact','Comfortable']});tweak.addToggle(design,'running',{label:'Void War running'});}
  })();
  </script>
</div>
