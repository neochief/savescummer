# Addendum: games the pinned Ludusavi manifest does not know, and fixes for
# games it gets wrong. See PLAN-CATALOG.md §2.2. The manifest wins per field;
# an entry here fills only fields the manifest did not produce, except fields
# under `override`, which replace the manifest's.

# Risk of Rain Returns: the manifest's `*_localsave.json` matches every Steam
# account's save on the machine (the `*` is the SteamID64, verified 2026-09-24:
# `76561198004523847_localsave.json` next to config folder `user_44258119`),
# so a Load would roll back the other accounts too. Pin it to the current one.
"Risk of Rain Returns":
  override:
    save:
      - when: { os: windows }
        path: "{APPDATA}/Risk_of_Rain_Returns/{STEAM_ID64}_localsave.json"
      - when: { store: steam }
        path: "{STEAM_USERDATA}/1337520/remote"

# Paradox games below: the manifest lists the whole user folder (tagged config
# and save), which also holds mods, settings and `logs/game.log`. The log is
# held open while the game runs, so a Load at the main menu would always be
# refused, every Save would copy the mods, and a Load would roll back mods and
# settings. Narrow each to its `save games` folder. EU5, HOI4 and Imperator
# already point there in the manifest.
"Crusader Kings II":
  override:
    save:
      - when: { os: windows }
        path: "{DOCUMENTS}/Paradox Interactive/Crusader Kings II/save games"
      - when: { os: macos }
        path: "{HOME}/Paradox Interactive/Crusader Kings II/save games"
      - when: { os: linux }
        path: "{HOME}/.paradoxinteractive/Crusader Kings II/save games"
"Europa Universalis IV":
  override:
    save:
      - when: { os: windows }
        path: "{DOCUMENTS}/Paradox Interactive/Europa Universalis IV/save games"
      - when: { os: macos }
        path: "{HOME}/Documents/Paradox Interactive/Europa Universalis IV/save games"
      - when: { os: linux }
        path: "{XDG_DATA_HOME}/Paradox Interactive/Europa Universalis IV/save games"
"Stellaris":
  override:
    save:
      - when: { os: windows }
        path: "{DOCUMENTS}/Paradox Interactive/Stellaris/save games"
      - when: { os: macos }
        path: "{HOME}/Documents/Paradox Interactive/Stellaris/save games"
      - when: { os: linux }
        path: "{XDG_DATA_HOME}/Paradox Interactive/Stellaris/save games"

# Terraria: on Windows and macOS the manifest lists the whole Terraria folder,
# which also holds tModLoader (mods, often hundreds of MB) and captures. Use
# the same player and world patterns the manifest already gives for Linux and
# Steam Cloud.
"Terraria":
  override:
    save:
      - when: { os: windows }
        path: "{DOCUMENTS}/My Games/Terraria/Players/*.plr"
      - when: { os: windows }
        path: "{DOCUMENTS}/My Games/Terraria/Worlds/*.wld"
      - when: { os: macos }
        path: "{HOME}/Library/Application Support/Terraria/Players/*.plr"
      - when: { os: macos }
        path: "{HOME}/Library/Application Support/Terraria/Worlds/*.wld"
      - when: { os: linux }
        path: "{XDG_DATA_HOME}/Terraria/Players/*.plr"
      - when: { os: linux }
        path: "{XDG_DATA_HOME}/Terraria/Worlds/*.wld"
      - when: { store: steam }
        path: "{STEAM_USERDATA}/105600/remote/players/*.plr"
      - when: { store: steam }
        path: "{STEAM_USERDATA}/105600/remote/worlds/*.wld"
      - when: { store: steam }
        path: "{STEAM_USERDATA}/105600/remote/achievements-steam.dat"

# Unreal games: the manifest lists `Saved` or the whole project folder, which
# also holds `Saved/Config`, `Saved/Crashes` and logs. Narrow to the standard
# `Saved/SaveGames` folder.
"State of Decay 2":
  override:
    save:
      - when: { os: windows }
        path: "{LOCALAPPDATA}/StateOfDecay2/Saved/SaveGames"
"Roboquest":
  override:
    save:
      - when: { os: windows }
        path: "{LOCALAPPDATA}/RoboQuest/Saved/SaveGames"

# Total War: Shogun 2: the manifest lists the whole `Shogun2` folder on
# Windows (battle replays and more besides `save_games`). Its Linux path,
# `<xdgData>/feral-interactive/SaveData`, doesn't name the game and may be a
# folder shared by Feral's ports, so Linux is left out until it's checked on a
# real machine (TEST-REAL-GAMES.md, section 1).
"Total War: Shogun 2":
  override:
    save:
      - when: { os: windows }
        path: "{APPDATA}/The Creative Assembly/Shogun2/save_games"

# Don't Starve: Windows already points at `DoNotStarve/save`; Linux and macOS
# list the whole folder, which also holds `client_log.txt` and settings.
"Don't Starve":
  override:
    save:
      - when: { os: windows }
        path: "{DOCUMENTS}/Klei/DoNotStarve/save"
      - when: { os: macos }
        path: "{HOME}/Documents/Klei/DoNotStarve/save"
      - when: { os: linux }
        path: "{HOME}/.klei/DoNotStarve/save"
      - when: { store: steam }
        path: "{STEAM_USERDATA}/219740/remote"

# The Long Dark: the manifest's macOS row is `<xdgData>/Hinterland/TheLongDark`,
# and `{XDG_DATA_HOME}` never resolves on macOS (PLAN-CATALOG.md 4.4). The Mac
# build (Unity) writes to `~/.local/share/Hinterland/TheLongDark` like Linux
# does (PCGamingWiki's save location for macOS is `$XDG_DATA_HOME/Hinterland/
# TheLongDark`, checked 2026-09-25, and its default on a Mac is
# `~/.local/share`; Steam discussions since 2018 and savelocation.net agree;
# before 2018 it used `~/Library/Application Support/Hinterland`). Not yet
# checked on a real Mac install.
"The Long Dark":
  override:
    save:
      - when: { os: windows }
        path: "{LOCALAPPDATA}/Hinterland/TheLongDark"
      - when: { os: macos }
        path: "{HOME}/.local/share/Hinterland/TheLongDark"
      - when: { os: linux }
        path: "{XDG_DATA_HOME}/Hinterland/TheLongDark"

# Entries below were checked against real folders (Windows, 2026-09-24).

# Enter the Gungeon: the Unity folder also holds `Unity/` (engine cache),
# `Crashes/` and `output_log.txt`. The saves are `SlotA.save`, `SlotB.save`,
# `SlotC.save`; `Slot*.options` are settings. The Steam userdata folder held
# only Steam's `remotecache.vdf`, which is always excluded.
"Enter the Gungeon":
  override:
    save:
      - when: { os: windows }
        path: "{HOME}/AppData/LocalLow/Dodge Roll/Enter the Gungeon/Slot*.save"
      - when: { os: macos }
        path: "{HOME}/Library/Application Support/Dodge Roll/Enter the Gungeon/Slot*.save"
      - when: { os: linux }
        path: "{HOME}/.config/unity3d/Dodge Roll/Enter the Gungeon/Slot*.save"
      - when: { store: steam }
        path: "{STEAM_USERDATA}/311690"

# Into the Breach: the folder holds one `profile_<name>` folder per profile
# (`profile.lua`, `saveData.lua`, `undoSave.lua` and their `.backup` copies)
# next to `settings.lua`, `settings.lua.backup`, `log.txt`, `error.txt` and
# `io_test.txt`. Only the profile folders are saves.
"Into the Breach":
  override:
    save:
      - when: { os: windows }
        path: "{DOCUMENTS}/My Games/Into The Breach/profile_*"
      - when: { os: macos }
        path: "{HOME}/Library/Application Support/IntoTheBreach/profile_*"
      - when: { os: linux }
        path: "{XDG_DATA_HOME}/IntoTheBreach/profile_*"

# Dome Keeper: the Godot folder also holds `shader_cache/`, `logs/`, mod
# loader files, `playfab_client_config.cfg` and `options.txt`. The saves are
# `savegame_<n>.json`, `savegame_<n>_map.scn`, `savegame_<n>_map_replay.scn`
# and `savegame<n>_full.json`.
"Dome Keeper":
  override:
    save:
      - when: { os: windows }
        path: "{APPDATA}/Godot/app_userdata/Dome Keeper/savegame*"
      - when: { os: linux }
        path: "{XDG_DATA_HOME}/godot/app_userdata/Dome Keeper/savegame*"

# The Binding of Isaac: Rebirth: with Steam Cloud on, the local
# `My Games/Binding of Isaac …` folders hold only `log.txt` (always excluded)
# and `options.ini`. Keep the manifest's targets, which hold the saves when
# Steam Cloud is off, and exclude the settings file.
"The Binding of Isaac: Rebirth":
  override:
    exclude:
      - when: { os: windows }
        path: "{DOCUMENTS}/My Games/Binding of Isaac Rebirth/options.ini"
      - when: { os: windows }
        path: "{DOCUMENTS}/My Games/Binding of Isaac Afterbirth/options.ini"
      - when: { os: windows }
        path: "{DOCUMENTS}/My Games/Binding of Isaac Afterbirth+/options.ini"
      - when: { os: windows }
        path: "{DOCUMENTS}/My Games/Binding of Isaac Repentance/options.ini"
      - when: { os: windows }
        path: "{DOCUMENTS}/My Games/Binding of Isaac Repentance+/options.ini"
      - when: { os: windows, store: gog }
        path: "{DOCUMENTS}/My Games/Binding of Isaac Repentance (Galaxy)/options.ini"
      - when: { os: macos }
        path: "{HOME}/Library/Application Support/Binding of Isaac Rebirth/options.ini"
      - when: { os: linux }
        path: "{XDG_DATA_HOME}/binding of isaac rebirth/options.ini"

# Six Ages: Ride Like the Wind: `<install>/Documents` holds the save folder
# `StormAge` and, on the machine checked, four hand-made copies
# (`StormAge - Copy`, …). Copies would bloat every checkpoint, and a Load
# would delete copies made after it. On macOS the saves are in a group
# container shared with Six Ages 2 (`DarkAge`, with its own hand-made copies,
# which Steam Cloud syncs too), so only `StormAge` is taken there as well.
# The manifest limits both to Steam, but the game picks the folders itself:
# GOG builds (Windows and macOS) save to the same places.
"Six Ages: Ride Like the Wind":
  override:
    save:
      - when: { os: windows }
        path: "{INSTALL_DIR}/Documents/StormAge"
      - when: { os: macos }
        path: "{HOME}/Library/Group Containers/group.com.a-sharp.Six-Ages/StormAge"

# Six Ages 2: Lights Going Out: not in the manifest. Save folders as the
# developer gives them (Steam discussion 3825288583727164417): on Windows
# `<install>/Documents/DarkAge`, on macOS `DarkAge` in the group container it
# shares with the first game (checked on a Mac, 2026-09-25:
# `DarkAge/Slot1/Save-*.6a`). Not limited to Steam, as for the first game.
# The Windows executable and GOG's install folder are from GOG's build
# manifest (1.0.4); Steam's install folder and macOS app from a Steam install.
# GOG's macOS build installs as the bundle itself
# (`Six Ages 2 Lights Going Out.app`), so it has no executable to list.
"Six Ages 2: Lights Going Out":
  detect:
    steam: 2278010
    gog: 1834655399
  installDirs: ["Six Ages Lights Going Out", "Six Ages 2 Lights Going Out"]
  executables:
    windows: ["Lights Going Out.exe"]
    macos: ["LightsGoingOut.app"]
  save:
    - when: { os: windows }
      path: "{INSTALL_DIR}/Documents/DarkAge"
    - when: { os: macos }
      path: "{HOME}/Library/Group Containers/group.com.a-sharp.Six-Ages/DarkAge"

# Void War: the saves are `autosave.sav`, `profile.sav` and `score.sav`.
# The folder also holds `crewnames.txt`, `enemynames.txt`, `gm_exports/`, a
# `bkk/` folder and another backup tool's `_gbm_backup_metadata.xml`.
"Void War":
  detect:
    steam: 2853590
  executables:
    windows: ["Void War.exe"]
  save:
    - when: { os: windows }
      path: "{APPDATA}/Void_War/*.sav"
