<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="1254" height="1254" viewBox="0 0 1254 1254" version="1.1" fill="#ffffff" stroke="#0a0505" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="art-title art-description" data-outline-width="20">
  <title id="art-title">Skeleton gamer — articulated vector</title>
  <desc id="art-description">Vector reconstruction of the crouching skeleton illustration. Transparent background; white bones with a uniform 20-unit #0a0505 outline, matching dark skull features, and #ff0028 red accents. The complete head, torso, gamepad, both upper arms, forearms, hands, thighs, shins and feet are separate named layers. Closed rounded bone ends continue beneath adjoining layers. Limb groups form parent–child chains for skeletal rotation; the gamepad is a separate layer within the gripping hand. All joint coordinates use the original 1254 by 1254 viewBox. No raster images, scripts, masks, linked fill copies or embedded animation.</desc>
  <metadata id="skeleton-rig">{
  "version": 2,
  "units": "viewBox",
  "viewBox": [
    0,
    0,
    1254,
    1254
  ],
  "outline": {
    "color": "#0a0505",
    "width": 20
  },
  "boneFill": "#ffffff",
  "accent": "#ff0028",
  "rotation": "Set transform=\"rotate(angle pivotX pivotY)\" on the named group. data-pivot gives the joint in viewBox coordinates; descendants follow the parent. Reset by removing transform.",
  "hierarchy": {
    "arm-controller-upper": [
      "arm-controller-forearm",
      "hand-controller",
      "controller"
    ],
    "arm-support-upper": [
      "arm-support-forearm",
      "hand-support"
    ],
    "leg-front-thigh": [
      "leg-front-shin",
      "leg-front-foot"
    ],
    "leg-back-thigh": [
      "leg-back-shin",
      "leg-back-foot"
    ]
  },
  "layering": "Support arm below complete head. Every movable bone has a closed, rounded end extending under its neighbor. Hands are complete silhouettes with articulated wrists. Three rounded rib bands form one grouped torso."
}</metadata>
