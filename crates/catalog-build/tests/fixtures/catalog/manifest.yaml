---
Dead Cells:
  cloud:
    steam: true
  files:
    "<base>/save/customGameData_*.json":
      tags:
        - save
      when:
        - os: windows
        - os: mac
        - os: linux
    "<base>/save/dc_options.json":
      tags:
        - config
      when:
        - os: windows
        - os: mac
        - os: linux
    "<base>/save/user_*.dat":
      tags:
        - save
      when:
        - os: windows
        - os: mac
        - os: linux
    "<root>/userdata/<storeUserId>/588650/remote/user_*.dat":
      tags:
        - save
      when:
        - store: steam
    "<winLocalAppData>/MotionTwin/DeadCells/user_*.dat":
      tags:
        - save
      when:
        - os: windows
          store: microsoft
  gog:
    id: 1237807960
  installDir:
    Dead Cells: {}
  launch:
    "<base>/deadcells.exe":
      - when:
          - os: windows
            store: steam
    "<base>/deadcells.sh":
      - when:
          - os: linux
    "<base>/manual.html":
      - when:
          - os: windows
  steam:
    id: 588650
